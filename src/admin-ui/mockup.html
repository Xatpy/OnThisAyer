<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayer App Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=SF+Pro+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>

  <!-- Main iPhone Canvas Container -->
  <div class="iphone-screen" id="iphoneScreen">
    
    <!-- iOS Status Bar -->
    <header class="status-bar">
      <div class="status-time" id="statusTime">14:00</div>
      <div class="dynamic-island"></div>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 17 12" fill="currentColor">
          <rect x="0" y="9" width="2.5" height="3" rx="0.5"/>
          <rect x="4" y="6" width="2.5" height="6" rx="0.5"/>
          <rect x="8" y="3" width="2.5" height="9" rx="0.5"/>
          <rect x="12" y="0" width="2.5" height="12" rx="0.5"/>
        </svg>
        <svg class="icon-wifi" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 2.5a10.8 10.8 0 0 1 7.2 2.8.8.8 0 0 1-.1 1.2l-1 .8a.7.7 0 0 1-1-.1 8.2 8.2 0 0 0-10.2 0 .7.7 0 0 1-1 .1l-1-.8a.8.8 0 0 1-.1-1.2A10.8 10.8 0 0 1 8 2.5zm0 3.8a6.8 6.8 0 0 1 4.5 1.7.8.8 0 0 1 0 1.2l-1 .9a.7.7 0 0 1-1 0 4.3 4.3 0 0 0-5 0 .7.7 0 0 1-1 0l-1-.9a.8.8 0 0 1 0-1.2A6.8 6.8 0 0 1 8 6.3zm0 3.7a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/>
        </svg>
        <div class="battery-container">
          <div class="battery-body">
            <div class="battery-fill"></div>
          </div>
          <div class="battery-cap"></div>
        </div>
      </div>
    </header>

    <!-- App Navigation Header -->
    <nav class="app-navbar">
      <button class="nav-icon-btn settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <div class="date-capsule">
        <span class="chevron left">‹</span>
        <span class="date-text" id="navbarDateText">August 29</span>
        <span class="dropdown-arrow">∨</span>
        <span class="chevron right">›</span>
      </div>

      <button class="nav-icon-btn calendar-btn" aria-label="Calendar">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>
    </nav>

    <!-- Year Pills Filter Row -->
    <div class="year-pills-row" id="yearPillsRow">
      <!-- Injected via JS -->
    </div>

    <!-- Memory Sections Container (3 Years Stacked) -->
    <main class="memories-container" id="memoriesContainer">
      <!-- Injected via JS -->
    </main>

    <!-- iOS Bottom Home Indicator -->
    <footer class="home-indicator-bar">
      <div class="home-indicator"></div>
    </footer>

  </div>

  <script type="module">
    const MONTH_NAMES_EN = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    async function loadMockup() {
      const urlParams = new URLSearchParams(window.location.search);
      const m = parseInt(urlParams.get('month') || '8', 10);
      const d = parseInt(urlParams.get('day') || '29', 10);
      const monthName = MONTH_NAMES_EN[m - 1] || 'August';

      document.getElementById('navbarDateText').textContent = `${monthName} ${d}`;

      try {
        const res = await fetch(`/api/events/${m}/${d}`);
        const data = await res.json();
        
        let selectedEvents = [];
        if (data.curatedSelection?.selectedEventIds?.length) {
          selectedEvents = data.curatedSelection.selectedEventIds
            .map(id => data.events.find(e => e.id === id))
            .filter(Boolean);
        }

        // Fallback: take top 3 events
        if (selectedEvents.length === 0) {
          selectedEvents = (data.events || []).slice(0, 3);
        }

        renderYears(m, d, monthName, selectedEvents);
      } catch (err) {
        console.error('Error loading mockup data:', err);
      }
    }

    function renderYears(month, day, monthName, events) {
      const pillsContainer = document.getElementById('yearPillsRow');
      const memoriesContainer = document.getElementById('memoriesContainer');

      // 1. Render Year Pills
      pillsContainer.innerHTML = events.map((e, idx) => `
        <div class="year-pill ${idx === 0 ? 'active' : ''}">
          ${e.year}
        </div>
      `).join('');

      // 2. Render 3 Memory Sections
      memoriesContainer.innerHTML = events.map(e => {
        const imagesList = (e.images && e.images.length > 0) ? e.images : (e.image ? [e.image] : []);
        const count = Math.min(3, Math.max(1, imagesList.length));
        const countText = `${count} ${count === 1 ? 'memory' : 'memories'}`;

        return `
          <section class="memory-section">
            <div class="section-header">
              <div class="section-title-group">
                <h2 class="year-heading">${e.year}</h2>
                <div class="date-subheading">${monthName} ${day}, ${e.year}</div>
              </div>
              <div class="memories-count">${countText}</div>
            </div>

            <div class="photos-grid count-${count}">
              ${imagesList.slice(0, 3).map((img, i) => `
                <div class="photo-card">
                  <img src="${img.url || img.thumbnailUrl}" alt="${e.year} memory ${i + 1}" crossorigin="anonymous">
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');

      // Signal ready for screenshot
      window.__MOCKUP_READY__ = true;
    }

    window.addEventListener('DOMContentLoaded', loadMockup);
  </script>
</body>
</html>
